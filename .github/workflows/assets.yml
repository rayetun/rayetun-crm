name: Update WordPress.org assets & readme

# Pushing changes to the banner/icon/screenshots or readme.txt on main updates
# the directory listing without needing a new plugin release.
on:
  push:
    branches: [main]
    paths:
      - '.wordpress-org/**'
      - 'readme.txt'
  # Allow a manual re-sync of readme/assets from the Actions tab or CLI.
  workflow_dispatch:

jobs:
  assets:
    name: Update assets & readme
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update assets & readme on WordPress.org
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: rayetun-crm
          # Update only readme.txt and the /assets folder; never rsync the repo
          # over trunk. The compiled build/ directory is gitignored (built fresh
          # in CI on release), so a full trunk sync would try to delete it and
          # the action would abort. This flag keeps trunk's code untouched.
          IGNORE_OTHER_FILES: true
